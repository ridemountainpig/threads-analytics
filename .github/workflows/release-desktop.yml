name: Release Desktop (macOS)

# Manually triggered. Builds the ad-hoc signed Apple silicon app on a macOS
# runner, zips it, and publishes a GitHub Release tagged v<version> at the
# commit the workflow was dispatched from. Only dispatches from main publish.
#
# desktop/app.json only accepts a plain X.Y.Z version (Native SDK manifest
# schema), so pre-release suffixes live in the tag and asset name only:
#   version input  → 0.1.0-beta.1
#   app.json       → 0.1.0            (must match the X.Y.Z prefix)
#   tag            → v0.1.0-beta.1
#   asset          → Threads-Analytics-0.1.0-beta.1-macos-arm64.zip

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, e.g. 0.1.0-beta.1. The X.Y.Z prefix must match desktop/app.json and package.json."
        required: true
        type: string
      prerelease:
        description: "Mark the GitHub Release as a pre-release. Versions with a suffix (-beta.1, -rc.1) are always pre-releases."
        required: false
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: release-desktop
  cancel-in-progress: false

env:
  APP_NAME: Threads-Analytics

# Actions are pinned to commit SHAs because this job can push tags and
# publish releases (contents: write).
jobs:
  package-macos:
    runs-on: macos-14
    steps:
      - name: Require the main branch
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::Desktop releases are only published from main (dispatched from $GITHUB_REF)"
          exit 1

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate release version
        id: release
        env:
          VERSION: ${{ inputs.version }}
          PRERELEASE_INPUT: ${{ inputs.prerelease }}
        run: |
          set -euo pipefail

          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::Version '$VERSION' must look like X.Y.Z or X.Y.Z-suffix (e.g. 0.1.0-beta.1)"
            exit 1
          fi

          base="${VERSION%%-*}"
          manifest_version="$(node -p "require('./desktop/app.json').version")"
          package_version="$(node -p "require('./package.json').version")"

          if [[ "$manifest_version" != "$base" ]]; then
            echo "::error::desktop/app.json version is '$manifest_version' but the release version prefix is '$base'"
            exit 1
          fi
          if [[ "$package_version" != "$base" ]]; then
            echo "::error::package.json version is '$package_version' but the release version prefix is '$base'"
            exit 1
          fi

          tag="v$VERSION"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
            echo "::error::Tag '$tag' already exists on origin"
            exit 1
          fi

          prerelease="$PRERELEASE_INPUT"
          if [[ "$VERSION" == *-* ]]; then
            prerelease="true"
          fi

          {
            echo "version=$VERSION"
            echo "tag=$tag"
            echo "asset=${APP_NAME}-${VERSION}-macos-arm64.zip"
            echo "prerelease=$prerelease"
          } >> "$GITHUB_OUTPUT"

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate packaging runtime
        run: pnpm desktop:package:check

      - name: Type-check and test the desktop target
        run: |
          pnpm desktop:prisma:generate
          pnpm desktop:prisma:validate
          pnpm desktop:typecheck
          pnpm desktop:test

      - name: Build and package macOS app
        env:
          # Baked into the app so it can compare itself against GitHub Releases.
          THREADS_ANALYTICS_DESKTOP_VERSION: ${{ steps.release.outputs.version }}
        run: pnpm desktop:package:macos

      - name: Zip app bundle
        working-directory: desktop/zig-out/package
        env:
          ASSET: ${{ steps.release.outputs.asset }}
        run: |
          set -euo pipefail
          ditto -c -k --keepParent "${APP_NAME}.app" "$RUNNER_TEMP/$ASSET"
          (cd "$RUNNER_TEMP" && shasum -a 256 "$ASSET" > "$ASSET.sha256")
          cat "$RUNNER_TEMP/$ASSET.sha256"

      - name: Verify zipped bundle
        env:
          ASSET: ${{ steps.release.outputs.asset }}
        run: |
          set -euo pipefail
          extract="$RUNNER_TEMP/verify"
          rm -rf "$extract" && mkdir -p "$extract"
          ditto -x -k "$RUNNER_TEMP/$ASSET" "$extract"
          app="$extract/${APP_NAME}.app"
          test -x "$app/Contents/MacOS/threads-analytics-desktop"
          test -x "$app/Contents/Resources/dist/runtime/node"
          test -f "$app/Contents/Resources/dist/server/server.js"
          test -d "$app/Contents/Resources/dist/runtime/prisma/migrations"
          codesign --verify --deep --strict --verbose=2 "$app"
          # Boots the extracted bundle's own Node sidecar outside the checkout
          # and checks it serves (migrations, SQLite, loopback Host guard).
          node desktop/scripts/smoke-test-app.mjs "$app"

      - name: Write release notes
        env:
          VERSION: ${{ steps.release.outputs.version }}
          ASSET: ${{ steps.release.outputs.asset }}
          PRERELEASE: ${{ steps.release.outputs.prerelease }}
        run: |
          set -euo pipefail
          sha="$(cut -d ' ' -f 1 "$RUNNER_TEMP/$ASSET.sha256")"
          label="Release"
          if [[ "$PRERELEASE" == "true" ]]; then label="Preview"; fi

          cat > "$RUNNER_TEMP/notes.md" <<NOTES
          ## Threads Analytics Desktop $VERSION ($label)

          macOS, Apple silicon (arm64) only. This build is ad-hoc signed and **not notarized** by Apple, so macOS may block the first launch. See the install guide for how to open it and how to update an existing installation:

          - [Install guide (English)](https://github.com/${GITHUB_REPOSITORY}/blob/${GITHUB_SHA}/desktop/docs/install-macos.md)
          - [安裝說明（繁體中文）](https://github.com/${GITHUB_REPOSITORY}/blob/${GITHUB_SHA}/desktop/docs/install-macos-zh.md)
          - [インストールガイド（日本語）](https://github.com/${GITHUB_REPOSITORY}/blob/${GITHUB_SHA}/desktop/docs/install-macos-ja.md)

          Only download the app from this project's GitHub Releases.

          ### Asset

          | File | SHA-256 |
          | --- | --- |
          | \`$ASSET\` | \`$sha\` |

          Built from ${GITHUB_SHA}.
          NOTES

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.release.outputs.version }}
          TAG: ${{ steps.release.outputs.tag }}
          ASSET: ${{ steps.release.outputs.asset }}
          PRERELEASE: ${{ steps.release.outputs.prerelease }}
        run: |
          set -euo pipefail
          args=(
            "$TAG"
            --target "$GITHUB_SHA"
            --title "Threads Analytics Desktop $VERSION"
            --notes-file "$RUNNER_TEMP/notes.md"
          )
          if [[ "$PRERELEASE" == "true" ]]; then args+=(--prerelease); fi
          gh release create "${args[@]}" \
            "$RUNNER_TEMP/$ASSET" \
            "$RUNNER_TEMP/$ASSET.sha256"
          echo "Published https://github.com/${GITHUB_REPOSITORY}/releases/tag/${TAG}"
