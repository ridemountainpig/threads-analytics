name: Release Desktop (macOS)

# Manually triggered. Builds the Apple silicon app on a macOS runner, signs
# it with a Developer ID, notarizes and staples it, zips it, and publishes a
# GitHub Release tagged v<version> at the commit the workflow was dispatched
# from. Only dispatches from main publish.
#
# Signing and notarization read these secrets from the desktop-release
# environment:
#   MACOS_CERTIFICATE_P12       base64 of the Developer ID Application .p12
#   MACOS_CERTIFICATE_PASSWORD  password of that .p12
#   MACOS_SIGNING_IDENTITY      e.g. "Developer ID Application: Name (TEAMID)"
#   APPLE_API_KEY_P8            App Store Connect API team key (.p8 contents)
#   APPLE_API_KEY_ID            its Key ID
#   APPLE_API_ISSUER_ID         its Issuer ID
#
# desktop/app.json only accepts a plain X.Y.Z version (Native SDK manifest
# schema), so pre-release suffixes live in the tag and asset name only:
#   version input  → 0.1.0-beta.1
#   app.json       → 0.1.0            (must match the X.Y.Z prefix)
#   tag            → v0.1.0-beta.1
#   asset          → Threads-Analytics-0.1.0-beta.1-macos-arm64.zip

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, e.g. 0.1.0-beta.1. The X.Y.Z prefix must match desktop/app.json and package.json."
        required: true
        type: string
      prerelease:
        description: "Mark the GitHub Release as a pre-release. Versions with a suffix (-beta.1, -rc.1) are always pre-releases and only prompt installed betas to update. A plain version marked pre-release prompts no installed app until the box is unchecked."
        required: false
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: release-desktop
  cancel-in-progress: false

env:
  APP_NAME: Threads Analytics
  # GitHub rewrites spaces in release asset names, so the ZIP keeps a hyphen.
  ASSET_PREFIX: Threads-Analytics

# Actions are pinned to commit SHAs because this job can push tags and
# publish releases (contents: write).
jobs:
  package-macos:
    # Older runners' `security import` can reject a .p12 exported by newer
    # Keychain Access (AES encryption) as a wrong password.
    runs-on: macos-15
    # Holds the signing secrets; restrict its deployment branches to main.
    environment: desktop-release
    steps:
      - name: Require the main branch
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::Desktop releases are only published from main (dispatched from $GITHUB_REF)"
          exit 1

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate release version
        id: release
        env:
          VERSION: ${{ inputs.version }}
          PRERELEASE_INPUT: ${{ inputs.prerelease }}
        run: |
          set -euo pipefail

          # Must stay within what parseReleaseVersion (lib/release-version.ts)
          # accepts, or installed apps cannot compare against the release: no
          # leading zeros in X.Y.Z and no empty dot-separated suffix parts.
          version_pattern='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z]+(\.[0-9A-Za-z]+)*)?$'
          if [[ ! "$VERSION" =~ $version_pattern ]]; then
            echo "::error::Version '$VERSION' must look like X.Y.Z or X.Y.Z-suffix (e.g. 0.1.0-beta.1), with no leading zeros and no empty suffix parts"
            exit 1
          fi

          base="${VERSION%%-*}"
          manifest_version="$(node -p "require('./desktop/app.json').version")"
          package_version="$(node -p "require('./package.json').version")"

          if [[ "$manifest_version" != "$base" ]]; then
            echo "::error::desktop/app.json version is '$manifest_version' but the release version prefix is '$base'"
            exit 1
          fi
          if [[ "$package_version" != "$base" ]]; then
            echo "::error::package.json version is '$package_version' but the release version prefix is '$base'"
            exit 1
          fi

          tag="v$VERSION"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
            echo "::error::Tag '$tag' already exists on origin"
            exit 1
          fi

          prerelease="$PRERELEASE_INPUT"
          if [[ "$VERSION" == *-* ]]; then
            prerelease="true"
          fi

          {
            echo "version=$VERSION"
            echo "tag=$tag"
            echo "asset=${ASSET_PREFIX}-${VERSION}-macos-arm64.zip"
            echo "prerelease=$prerelease"
          } >> "$GITHUB_OUTPUT"

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate packaging runtime
        run: pnpm desktop:package:check

      # The desktop target type-checks the shared app code, which imports the
      # web client from lib/generated/prisma, so both clients are generated.
      - name: Type-check and test the desktop target
        run: |
          pnpm prisma:generate
          pnpm desktop:prisma:generate
          pnpm desktop:prisma:validate
          pnpm desktop:typecheck
          pnpm desktop:test

      # codesign needs the identity in a searchable keychain, plus Apple's
      # Developer ID G2 intermediate to build the certificate chain.
      - name: Import signing certificate
        env:
          CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          INTERMEDIATE_SHA256: f16cd3c54c7f83cea4bf1a3e6a0819c8aaa8e4a1528fd144715f350643d2df3a
        run: |
          set -euo pipefail
          shopt -s extglob
          # package-macos.mjs trims the identity too, so a pasted newline matches.
          SIGNING_IDENTITY="${SIGNING_IDENTITY##+([[:space:]])}"
          SIGNING_IDENTITY="${SIGNING_IDENTITY%%+([[:space:]])}"
          if [[ -z "$CERTIFICATE_P12" || -z "$CERTIFICATE_PASSWORD" || -z "$SIGNING_IDENTITY" ]]; then
            echo "::error::MACOS_CERTIFICATE_P12, MACOS_CERTIFICATE_PASSWORD, and MACOS_SIGNING_IDENTITY secrets are required"
            exit 1
          fi

          keychain="$RUNNER_TEMP/signing.keychain-db"
          keychain_password="$(openssl rand -base64 24)"
          printf '%s' "$CERTIFICATE_P12" | base64 --decode > "$RUNNER_TEMP/signing.p12"
          curl -fsSL -o "$RUNNER_TEMP/DeveloperIDG2CA.cer" \
            https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer
          echo "$INTERMEDIATE_SHA256  $RUNNER_TEMP/DeveloperIDG2CA.cer" | shasum -a 256 -c -

          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$RUNNER_TEMP/signing.p12" -k "$keychain" -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security import "$RUNNER_TEMP/DeveloperIDG2CA.cer" -k "$keychain"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/signing.p12"

          identities="$(security find-identity -v -p codesigning "$keychain")"
          if [[ "$identities" != *"\"$SIGNING_IDENTITY\""* ]]; then
            echo "::error::MACOS_SIGNING_IDENTITY does not match a valid identity in MACOS_CERTIFICATE_P12"
            echo "$identities"
            exit 1
          fi

      - name: Build and package macOS app
        env:
          # Baked into the app so it can compare itself against GitHub Releases.
          THREADS_ANALYTICS_DESKTOP_VERSION: ${{ steps.release.outputs.version }}
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
        run: pnpm desktop:package:macos

      # Fails fast, before waiting on the notary service: the sidecar under the
      # hardened runtime, then the signed shell launching it.
      - name: Smoke-test signed app
        run: |
          pnpm desktop:smoke:macos
          pnpm desktop:smoke:macos --shell

      # Notarizes the bundle and staples the ticket so Gatekeeper accepts the
      # app offline. On rejection, the notary log names the offending files.
      - name: Notarize app bundle
        working-directory: desktop/zig-out/package
        env:
          API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          set -euo pipefail
          if [[ -z "$API_KEY_P8" || -z "$API_KEY_ID" || -z "$API_ISSUER_ID" ]]; then
            echo "::error::APPLE_API_KEY_P8, APPLE_API_KEY_ID, and APPLE_API_ISSUER_ID secrets are required"
            exit 1
          fi

          key="$RUNNER_TEMP/AuthKey.p8"
          submission="$RUNNER_TEMP/notarize.zip"
          printf '%s\n' "$API_KEY_P8" > "$key"
          auth=(--key "$key" --key-id "$API_KEY_ID" --issuer "$API_ISSUER_ID")
          ditto -c -k --keepParent "${APP_NAME}.app" "$submission"

          # Kept going on a non-zero exit so a rejection still prints its log.
          # The timeout leaves room in the 6-hour job limit to report the state.
          result="$(xcrun notarytool submit "$submission" "${auth[@]}" --wait --timeout 4h --output-format json)" || true
          echo "$result"
          field() {
            node -e 'const s = process.argv[1]; try { console.log(JSON.parse(s.slice(s.indexOf("{"), s.lastIndexOf("}") + 1))[process.argv[2]] ?? ""); } catch { console.log(""); }' "$result" "$1"
          }
          status="$(field status)"
          if [[ "$status" != "Accepted" ]]; then
            submission_id="$(field id)"
            if [[ -n "$submission_id" ]]; then xcrun notarytool log "$submission_id" "${auth[@]}" || true; fi
            echo "::error::Notarization did not succeed (status: ${status:-unknown}, submission: ${submission_id:-none})"
            exit 1
          fi

          xcrun stapler staple "${APP_NAME}.app"
          rm "$submission"

      - name: Zip app bundle
        working-directory: desktop/zig-out/package
        env:
          ASSET: ${{ steps.release.outputs.asset }}
        run: |
          set -euo pipefail
          ditto -c -k --keepParent "${APP_NAME}.app" "$RUNNER_TEMP/$ASSET"
          (cd "$RUNNER_TEMP" && shasum -a 256 "$ASSET" > "$ASSET.sha256")
          cat "$RUNNER_TEMP/$ASSET.sha256"

      - name: Verify zipped bundle
        env:
          ASSET: ${{ steps.release.outputs.asset }}
        run: |
          set -euo pipefail
          extract="$RUNNER_TEMP/verify"
          rm -rf "$extract" && mkdir -p "$extract"
          ditto -x -k "$RUNNER_TEMP/$ASSET" "$extract"
          app="$extract/${APP_NAME}.app"
          test -x "$app/Contents/MacOS/threads-analytics-desktop"
          test -x "$app/Contents/Resources/dist/runtime/node"
          test -f "$app/Contents/Resources/dist/server/server.js"
          test -d "$app/Contents/Resources/dist/runtime/prisma/migrations"
          codesign --verify --deep --strict --verbose=2 "$app"
          xcrun stapler validate "$app"
          # Checks the reported source, not just the exit status, so a host with
          # assessments disabled cannot pass vacuously.
          assessment="$(spctl --assess --type execute --verbose=2 "$app" 2>&1)" || true
          echo "$assessment"
          if [[ "$assessment" != *"source=Notarized Developer ID"* ]]; then
            echo "::error::Gatekeeper does not accept the app as notarized"
            exit 1
          fi
          # Boots the extracted bundle's own Node sidecar outside the checkout
          # and checks it serves (migrations, SQLite, loopback Host guard).
          node desktop/scripts/smoke-test-app.mjs "$app"

      - name: Write release notes
        env:
          VERSION: ${{ steps.release.outputs.version }}
          ASSET: ${{ steps.release.outputs.asset }}
          PRERELEASE: ${{ steps.release.outputs.prerelease }}
        run: |
          set -euo pipefail
          sha="$(cut -d ' ' -f 1 "$RUNNER_TEMP/$ASSET.sha256")"
          label="Release"
          if [[ "$PRERELEASE" == "true" ]]; then label="Preview"; fi

          cat > "$RUNNER_TEMP/notes.md" <<NOTES
          ## Threads Analytics Desktop $VERSION ($label)

          macOS, Apple silicon (arm64) only. Signed with a Developer ID and notarized by Apple. See the install guide for how to install it and how to update an existing installation:

          - [Install guide (English)](https://github.com/${GITHUB_REPOSITORY}/blob/${GITHUB_SHA}/desktop/docs/install-macos.md)
          - [安裝說明（繁體中文）](https://github.com/${GITHUB_REPOSITORY}/blob/${GITHUB_SHA}/desktop/docs/install-macos-zh.md)
          - [インストールガイド（日本語）](https://github.com/${GITHUB_REPOSITORY}/blob/${GITHUB_SHA}/desktop/docs/install-macos-ja.md)

          Only download the app from this project's GitHub Releases.

          ### Asset

          | File | SHA-256 |
          | --- | --- |
          | \`$ASSET\` | \`$sha\` |

          Built from ${GITHUB_SHA}.
          NOTES

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.release.outputs.version }}
          TAG: ${{ steps.release.outputs.tag }}
          ASSET: ${{ steps.release.outputs.asset }}
          PRERELEASE: ${{ steps.release.outputs.prerelease }}
        run: |
          set -euo pipefail
          args=(
            "$TAG"
            --target "$GITHUB_SHA"
            --title "Threads Analytics Desktop $VERSION"
            --notes-file "$RUNNER_TEMP/notes.md"
          )
          if [[ "$PRERELEASE" == "true" ]]; then args+=(--prerelease); fi
          gh release create "${args[@]}" \
            "$RUNNER_TEMP/$ASSET" \
            "$RUNNER_TEMP/$ASSET.sha256"
          echo "Published https://github.com/${GITHUB_REPOSITORY}/releases/tag/${TAG}"

      - name: Remove signing material
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/signing.p12" "$RUNNER_TEMP/AuthKey.p8"
