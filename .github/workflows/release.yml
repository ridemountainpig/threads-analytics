name: Release

# Manually triggered from main with a version. Releases the Mac app and the
# dashboard's Docker image as one version, built from one commit:
#   validate       checks the version, the manifests and CHANGELOG.md, and
#                  that neither the v<version> tag nor the X.Y.Z image exists
#   package-macos  builds the Apple silicon app on a macOS runner, signs it
#                  with a Developer ID, notarizes and staples it, and zips it
#   image          meanwhile builds and smoke-tests the image with
#                  docker-publish.yml and pushes it as sha-<short sha>
#   tag-image      once both have passed, tags that exact image X.Y.Z
#   publish        signs the update feed for the ZIP and creates the GitHub
#                  Release tagged v<version>, always as a pre-release
# Existing installs see none of it until Promote Release (promote.yml) points
# `latest`, X.Y and X at the image and publishes the release.
#
# package-macos and publish read secrets from the desktop-release
# environment. Signing and notarization (package-macos):
#   MACOS_CERTIFICATE_P12       base64 of the Developer ID Application .p12
#   MACOS_CERTIFICATE_PASSWORD  password of that .p12
#   MACOS_SIGNING_IDENTITY      e.g. "Developer ID Application: Name (TEAMID)"
#   APPLE_API_KEY_P8            App Store Connect API team key (.p8 contents)
#   APPLE_API_KEY_ID            its Key ID
#   APPLE_API_ISSUER_ID         its Issuer ID
# The update feed (publish):
#   NATIVE_UPDATE_PRIVATE_KEY   base64 of the key file `native update keygen`
#                               writes; its public key is updates.public_key
#                               in desktop/app.json
#
# Installed apps update from the feed of the release GitHub marks as Latest
# (updates.feed_url in desktop/app.json), and the Native SDK updater only
# compares plain X.Y.Z versions. So every release gets a version of its own,
# matching desktop/app.json and package.json:
#   version input  → 1.0.0
#   tag            → v1.0.0
#   assets         → Threads-Analytics-1.0.0-macos-arm64.zip (+ .sha256),
#                    native-update.json
#   image          → ghcr.io/<owner>/<repo>:1.0.0
# Installed apps and the website's download page skip pre-releases, so the
# release can be tested before it is promoted.
#
# The release notes lead with the version's "## X.Y.Z" section of
# CHANGELOG.md, which the version bump adds; the run fails without one.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, a plain X.Y.Z such as 1.0.0. Must match desktop/app.json and package.json and have a section in CHANGELOG.md."
        required: true
        type: string
      update_notes:
        description: "Optional plain-text summary shown in the app's update dialog, e.g. Faster sync and a new growth chart."
        required: false
        type: string
        default: ""

permissions:
  contents: read

# Shared with promote.yml, so a version is never promoted mid-release.
concurrency:
  group: release
  cancel-in-progress: false

env:
  APP_NAME: Threads Analytics
  # GitHub rewrites spaces in release asset names, so the ZIP keeps a hyphen.
  ASSET_PREFIX: Threads-Analytics
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

# Actions are pinned to commit SHAs because these jobs hold signing secrets
# and publish releases (contents: write).
jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    outputs:
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}
      asset: ${{ steps.release.outputs.asset }}
    steps:
      - name: Require the main branch
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::Releases are only published from main (dispatched from $GITHUB_REF)"
          exit 1

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Validate release version
        id: release
        env:
          VERSION: ${{ inputs.version }}
          UPDATE_NOTES: ${{ inputs.update_notes }}
        run: |
          set -euo pipefail

          # The updater only compares plain X.Y.Z, and parseReleaseVersion
          # (lib/release-version.ts) rejects leading zeros.
          version_pattern='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'
          if [[ ! "$VERSION" =~ $version_pattern ]]; then
            echo "::error::Version '$VERSION' must be a plain X.Y.Z with no leading zeros (e.g. 1.0.0). Every release starts as a pre-release, so it needs no suffix"
            exit 1
          fi

          manifest_version="$(node -p "require('./desktop/app.json').version")"
          package_version="$(node -p "require('./package.json').version")"

          if [[ "$manifest_version" != "$VERSION" ]]; then
            echo "::error::desktop/app.json version is '$manifest_version' but the release version is '$VERSION'"
            exit 1
          fi
          if [[ "$package_version" != "$VERSION" ]]; then
            echo "::error::package.json version is '$package_version' but the release version is '$VERSION'"
            exit 1
          fi
          if ! node -e "const u = require('./desktop/app.json').updates; process.exit(u?.feed_url && u?.public_key ? 0 : 1)"; then
            echo "::error::desktop/app.json needs updates.feed_url and updates.public_key"
            exit 1
          fi
          # The update dialog's limit, checked before the build instead of after.
          if (( $(printf '%s' "$UPDATE_NOTES" | wc -c) > 16384 )); then
            echo "::error::update_notes must be at most 16 KB"
            exit 1
          fi

          # The publish job leads the notes with this section; checking it here
          # fails the run before the build.
          if [[ -z "$(node desktop/scripts/changelog-section.mjs "$VERSION")" ]]; then
            echo "::error::CHANGELOG.md needs a non-empty '## $VERSION' section"
            exit 1
          fi

          tag="v$VERSION"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
            echo "::error::Tag '$tag' already exists on origin"
            exit 1
          fi

          {
            echo "version=$VERSION"
            echo "tag=$tag"
            echo "asset=${ASSET_PREFIX}-${VERSION}-macos-arm64.zip"
          } >> "$GITHUB_OUTPUT"

      # Running images compare their version tag's digest against `latest`, so
      # a published X.Y.Z is never moved.
      - name: Check the image version is unpublished
        env:
          VERSION: ${{ steps.release.outputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          printf '%s' "$GH_TOKEN" | docker login "$REGISTRY" -u "$GITHUB_ACTOR" --password-stdin > /dev/null
          image="$REGISTRY/${IMAGE_NAME,,}:$VERSION"
          if output="$(docker buildx imagetools inspect "$image" 2>&1)"; then
            echo "::error::$image is already published; release a new version instead"
            exit 1
          elif [[ "$output" != *"not found"* ]]; then
            echo "::error::Couldn't check whether $image exists: $output"
            exit 1
          fi

  package-macos:
    needs: validate
    # Older runners' `security import` can reject a .p12 exported by newer
    # Keychain Access (AES encryption) as a wrong password.
    runs-on: macos-15
    # Holds the signing secrets; restrict its deployment branches to main.
    environment: desktop-release
    outputs:
      sha256: ${{ steps.zip.outputs.sha256 }}
    steps:
      # Dependency code runs in this job, so the write-scoped token stays out
      # of .git/config; only the release step gets it, through GH_TOKEN.
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate packaging runtime
        run: pnpm desktop:package:check

      # The desktop target type-checks the shared app code, which imports the
      # web client from lib/generated/prisma, so both clients are generated.
      - name: Type-check and test the desktop target
        run: |
          pnpm prisma:generate
          pnpm desktop:prisma:generate
          pnpm desktop:prisma:validate
          pnpm desktop:typecheck
          pnpm desktop:test

      # codesign needs the identity in a searchable keychain, plus Apple's
      # Developer ID G2 intermediate to build the certificate chain.
      - name: Import signing certificate
        env:
          CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          INTERMEDIATE_SHA256: f16cd3c54c7f83cea4bf1a3e6a0819c8aaa8e4a1528fd144715f350643d2df3a
        run: |
          set -euo pipefail
          shopt -s extglob
          # package-macos.mjs trims the identity too, so a pasted newline matches.
          SIGNING_IDENTITY="${SIGNING_IDENTITY##+([[:space:]])}"
          SIGNING_IDENTITY="${SIGNING_IDENTITY%%+([[:space:]])}"
          if [[ -z "$CERTIFICATE_P12" || -z "$CERTIFICATE_PASSWORD" || -z "$SIGNING_IDENTITY" ]]; then
            echo "::error::MACOS_CERTIFICATE_P12, MACOS_CERTIFICATE_PASSWORD, and MACOS_SIGNING_IDENTITY secrets are required"
            exit 1
          fi

          keychain="$RUNNER_TEMP/signing.keychain-db"
          keychain_password="$(openssl rand -base64 24)"
          printf '%s' "$CERTIFICATE_P12" | base64 --decode > "$RUNNER_TEMP/signing.p12"
          curl -fsSL -o "$RUNNER_TEMP/DeveloperIDG2CA.cer" \
            https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer
          echo "$INTERMEDIATE_SHA256  $RUNNER_TEMP/DeveloperIDG2CA.cer" | shasum -a 256 -c -

          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          # -x: the private key can sign but never be exported from the keychain.
          security import "$RUNNER_TEMP/signing.p12" -k "$keychain" -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign -x
          security import "$RUNNER_TEMP/DeveloperIDG2CA.cer" -k "$keychain"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/signing.p12"

          identities="$(security find-identity -v -p codesigning "$keychain")"
          if [[ "$identities" != *"\"$SIGNING_IDENTITY\""* ]]; then
            echo "::error::MACOS_SIGNING_IDENTITY does not match a valid identity in MACOS_CERTIFICATE_P12"
            echo "$identities"
            exit 1
          fi

      - name: Build and package macOS app
        env:
          # Baked into the app so it can compare itself against GitHub Releases.
          THREADS_ANALYTICS_DESKTOP_VERSION: ${{ needs.validate.outputs.version }}
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
        run: |
          pnpm desktop:package:macos
          # Signing is done; the smoke tests below run the bundled app's code.
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db"

      # Fails fast, before waiting on the notary service: the sidecar under the
      # hardened runtime, then the signed shell launching it.
      - name: Smoke-test signed app
        run: |
          pnpm desktop:smoke:macos
          pnpm desktop:smoke:macos --shell

      # Notarizes the bundle and staples the ticket so Gatekeeper accepts the
      # app offline. On rejection, the notary log names the offending files.
      - name: Notarize app bundle
        working-directory: desktop/zig-out/package
        env:
          API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          set -euo pipefail
          if [[ -z "$API_KEY_P8" || -z "$API_KEY_ID" || -z "$API_ISSUER_ID" ]]; then
            echo "::error::APPLE_API_KEY_P8, APPLE_API_KEY_ID, and APPLE_API_ISSUER_ID secrets are required"
            exit 1
          fi

          key="$RUNNER_TEMP/AuthKey.p8"
          submission="$RUNNER_TEMP/notarize.zip"
          # The verify step runs the app's code; the key must be gone by then.
          trap 'rm -f "$key" "$submission"' EXIT
          printf '%s\n' "$API_KEY_P8" > "$key"
          auth=(--key "$key" --key-id "$API_KEY_ID" --issuer "$API_ISSUER_ID")
          ditto -c -k --keepParent "${APP_NAME}.app" "$submission"

          # Kept going on a non-zero exit so a rejection still prints its log.
          # The timeout leaves room in the 6-hour job limit to report the state.
          result="$(xcrun notarytool submit "$submission" "${auth[@]}" --wait --timeout 4h --output-format json)" || true
          echo "$result"
          field() {
            node -e 'const s = process.argv[1]; try { console.log(JSON.parse(s.slice(s.indexOf("{"), s.lastIndexOf("}") + 1))[process.argv[2]] ?? ""); } catch { console.log(""); }' "$result" "$1"
          }
          status="$(field status)"
          if [[ "$status" != "Accepted" ]]; then
            submission_id="$(field id)"
            if [[ -n "$submission_id" ]]; then xcrun notarytool log "$submission_id" "${auth[@]}" || true; fi
            echo "::error::Notarization did not succeed (status: ${status:-unknown}, submission: ${submission_id:-none})"
            exit 1
          fi

          xcrun stapler staple "${APP_NAME}.app"

      - name: Zip app bundle
        id: zip
        working-directory: desktop/zig-out/package
        env:
          ASSET: ${{ needs.validate.outputs.asset }}
        run: |
          set -euo pipefail
          ditto -c -k --keepParent "${APP_NAME}.app" "$RUNNER_TEMP/$ASSET"
          (cd "$RUNNER_TEMP" && shasum -a 256 "$ASSET" > "$ASSET.sha256")
          cat "$RUNNER_TEMP/$ASSET.sha256"
          echo "sha256=$(cut -d ' ' -f 1 "$RUNNER_TEMP/$ASSET.sha256")" >> "$GITHUB_OUTPUT"

      - name: Verify zipped bundle
        env:
          ASSET: ${{ needs.validate.outputs.asset }}
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -euo pipefail
          extract="$RUNNER_TEMP/verify"
          rm -rf "$extract" && mkdir -p "$extract"
          ditto -x -k "$RUNNER_TEMP/$ASSET" "$extract"
          app="$extract/${APP_NAME}.app"
          # What the in-app updater insists on before it replaces anything: the
          # ZIP holds only the app, with the manifest's bundle id, the version
          # the feed names, and code for this target.
          if [[ "$(ls -A "$extract")" != "${APP_NAME}.app" ]]; then
            echo "::error::The ZIP must hold only ${APP_NAME}.app"
            ls -A "$extract"
            exit 1
          fi
          plist="$app/Contents/Info.plist"
          bundle_id="$(plutil -extract CFBundleIdentifier raw "$plist")"
          bundle_version="$(plutil -extract CFBundleVersion raw "$plist")"
          if [[ "$bundle_id" != "$(node -p "require('./desktop/app.json').id")" || "$bundle_version" != "$VERSION" ]]; then
            echo "::error::Bundle is $bundle_id $bundle_version, expected the desktop/app.json id at $VERSION"
            exit 1
          fi
          archs="$(lipo -archs "$app/Contents/MacOS/threads-analytics-desktop")"
          if [[ "$archs" != "arm64" ]]; then
            echo "::error::Expected an arm64 executable, found: $archs"
            exit 1
          fi
          test -x "$app/Contents/MacOS/threads-analytics-desktop"
          test -x "$app/Contents/Resources/dist/runtime/node"
          test -f "$app/Contents/Resources/dist/server/server.js"
          test -d "$app/Contents/Resources/dist/runtime/prisma/migrations"
          codesign --verify --deep --strict --verbose=2 "$app"
          # stapler looks the ticket up on Apple's CloudKit, which can drop the
          # connection (error 68), so a failure is retried before it counts.
          for attempt in 1 2 3; do
            if xcrun stapler validate "$app"; then break; fi
            if (( attempt == 3 )); then exit 1; fi
            sleep 20
          done
          # Checks the reported source, not just the exit status, so a host with
          # assessments disabled cannot pass vacuously.
          assessment="$(spctl --assess --type execute --verbose=2 "$app" 2>&1)" || true
          echo "$assessment"
          if [[ "$assessment" != *"source=Notarized Developer ID"* ]]; then
            echo "::error::Gatekeeper does not accept the app as notarized"
            exit 1
          fi
          # Boots the extracted bundle's own Node sidecar outside the checkout
          # and checks it serves (migrations, SQLite, loopback Host guard).
          node desktop/scripts/smoke-test-app.mjs "$app"

      # The publish job signs and releases exactly these bytes; it compares
      # them against this job's sha256 output first.
      - name: Upload release build
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: desktop-release
          path: |
            ${{ runner.temp }}/${{ needs.validate.outputs.asset }}
            ${{ runner.temp }}/${{ needs.validate.outputs.asset }}.sha256
          retention-days: 1
          if-no-files-found: error

      - name: Remove signing material
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/signing.p12" "$RUNNER_TEMP/AuthKey.p8"

  # Runs alongside package-macos. The image is pushed only as sha-<short sha>;
  # nothing that deployments pull changes here.
  image:
    needs: validate
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    uses: ./.github/workflows/docker-publish.yml
    with:
      version: ${{ needs.validate.outputs.version }}

  # Tags the digest the image job pushed, so X.Y.Z is exactly the image that
  # was smoke-tested, and only once the Mac app has passed as well.
  tag-image:
    needs: [validate, package-macos, image]
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - name: Tag the image with its version
        env:
          VERSION: ${{ needs.validate.outputs.version }}
          DIGEST: ${{ needs.image.outputs.digest }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          printf '%s' "$GH_TOKEN" | docker login "$REGISTRY" -u "$GITHUB_ACTOR" --password-stdin > /dev/null
          image="$REGISTRY/${IMAGE_NAME,,}"
          docker buildx imagetools create --tag "$image:$VERSION" "$image@$DIGEST"
          tagged="sha256:$(docker buildx imagetools inspect --raw "$image:$VERSION" | sha256sum | cut -d ' ' -f 1)"
          if [[ "$tagged" != "$DIGEST" ]]; then
            echo "::error::$image:$VERSION is $tagged, expected $DIGEST"
            exit 1
          fi
          echo "Tagged $image:$VERSION ($DIGEST)"

  # Signs the update feed and publishes the release on a fresh runner that
  # installs no dependencies and runs none of the app's code, so the update
  # key (which lets a feed reach every installed app) never shares a machine
  # with that code, and only this job gets the write-scoped token.
  publish:
    needs: [validate, package-macos, tag-image]
    runs-on: ubuntu-latest
    environment: desktop-release
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.validate.outputs.version }}
      TAG: ${{ needs.validate.outputs.tag }}
      ASSET: ${{ needs.validate.outputs.asset }}
    steps:
      # Only for desktop/app.json, CHANGELOG.md, and the signing and changelog
      # scripts, which use Node built-ins alone.
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Download release build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: desktop-release
          path: ${{ runner.temp }}/release

      - name: Check release build checksum
        working-directory: ${{ runner.temp }}/release
        env:
          EXPECTED_SHA256: ${{ needs.package-macos.outputs.sha256 }}
        run: |
          set -euo pipefail
          sha256sum -c "$ASSET.sha256"
          if [[ "$(cut -d ' ' -f 1 "$ASSET.sha256")" != "$EXPECTED_SHA256" ]]; then
            echo "::error::The downloaded build is not the one package-macos verified"
            exit 1
          fi

      # The feed pins the ZIP's URL, size, and SHA-256 under the update key.
      # Installed apps read it from the Latest release (updates.feed_url in
      # desktop/app.json), so it reaches no one until Promote Release
      # publishes the release.
      - name: Sign update feed
        env:
          NATIVE_UPDATE_PRIVATE_KEY: ${{ secrets.NATIVE_UPDATE_PRIVATE_KEY }}
          UPDATE_NOTES: ${{ inputs.update_notes }}
        run: |
          set -euo pipefail
          if [[ -z "$NATIVE_UPDATE_PRIVATE_KEY" ]]; then
            echo "::error::The NATIVE_UPDATE_PRIVATE_KEY secret is required"
            exit 1
          fi
          # --notes=… so notes starting with "-" are not read as an option.
          node desktop/scripts/sign-update-feed.mjs \
            --archive "$RUNNER_TEMP/release/$ASSET" \
            --url "https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/${ASSET}" \
            --output "$RUNNER_TEMP/release/native-update.json" \
            "--notes=$UPDATE_NOTES"

      # Promoting a preview doesn't rewrite these notes, so they don't name the
      # release type; GitHub's pre-release badge shows it.
      - name: Write release notes
        run: |
          set -euo pipefail
          sha="$(cut -d ' ' -f 1 "$RUNNER_TEMP/release/$ASSET.sha256")"
          changes="$(node desktop/scripts/changelog-section.mjs "$VERSION")"

          {
            printf '%s\n\n' "$changes"
            cat <<NOTES
          ### Mac app

          macOS, Apple silicon (arm64) only. Signed with a Developer ID and notarized by Apple. Installed copies that offer **Install** in their update notice update themselves; see the install guide for a first install or a manual update:

          - [Install guide (English)](https://github.com/${GITHUB_REPOSITORY}/blob/${GITHUB_SHA}/desktop/docs/install-macos.md)
          - [安裝說明（繁體中文）](https://github.com/${GITHUB_REPOSITORY}/blob/${GITHUB_SHA}/desktop/docs/install-macos-zh.md)
          - [インストールガイド（日本語）](https://github.com/${GITHUB_REPOSITORY}/blob/${GITHUB_SHA}/desktop/docs/install-macos-ja.md)

          Only download the app from this project's GitHub Releases.

          ### Docker image

          \`\`\`sh
          docker pull ghcr.io/${GITHUB_REPOSITORY,,}:$VERSION
          \`\`\`

          Built from the same commit as the Mac app. To update a self-hosted deployment, see [Updating](https://github.com/${GITHUB_REPOSITORY}/blob/${GITHUB_SHA}/README.md#updating).

          <details>
          <summary>Assets and checksums</summary>

          | File | SHA-256 |
          | --- | --- |
          | \`$ASSET\` | \`$sha\` |

          \`native-update.json\` is the signed update feed installed apps read.

          Built from ${GITHUB_SHA}.

          </details>
          NOTES
          } > "$RUNNER_TEMP/notes.md"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          args=(
            "$TAG"
            --repo "$GITHUB_REPOSITORY"
            --target "$GITHUB_SHA"
            --title "Threads Analytics $VERSION"
            --notes-file "$RUNNER_TEMP/notes.md"
            --prerelease
          )
          gh release create "${args[@]}" \
            "$RUNNER_TEMP/release/$ASSET" \
            "$RUNNER_TEMP/release/$ASSET.sha256" \
            "$RUNNER_TEMP/release/native-update.json"
          echo "Published https://github.com/${GITHUB_REPOSITORY}/releases/tag/${TAG}"
