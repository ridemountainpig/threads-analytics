name: CI

# Branch pushes are covered by their pull_request run; only main gets a push
# run, so each PR update runs CI once instead of twice.
on:
  push:
    branches: [main]
  pull_request:

# A new push to a PR cancels its older run, so a slower build of a stale commit
# can't finish last and overwrite the test build comment. Main pushes get a
# group of their own run, since a shared group would still drop queued runs.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Pull requests only run the jobs their changed files can affect. Skipping
  # through a job-level `if` keeps required checks satisfied (a skipped job
  # counts as passed), whereas a workflow-level `paths` filter would leave them
  # pending. Pushes to main always run everything.
  changes:
    runs-on: ubuntu-latest
    outputs:
      app: ${{ steps.classify.outputs.app }}
      website: ${{ steps.classify.outputs.website }}
    steps:
      # A pull_request checkout is the test merge commit, whose first parent is
      # the base branch, so a depth of 2 is enough to diff the whole PR.
      - name: Checkout repository
        if: github.event_name == 'pull_request'
        uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Classify changed files
        id: classify
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" != "pull_request" ]]; then
            echo "app=true" >> "$GITHUB_OUTPUT"
            echo "website=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # --no-renames lists a moved file under both paths, so moving a file
          # out of the dashboard still counts as a dashboard change.
          changed="$(git diff --no-renames --name-only HEAD^1 HEAD)"
          app=false
          website=false
          while IFS= read -r file; do
            [[ -z "$file" ]] && continue
            if [[ "$file" == website/* ]]; then
              website=true
            elif [[ "$file" == .github/workflows/ci.yml || "$file" == .nvmrc ]]; then
              app=true
              website=true
            elif [[ "$file" =~ ^(docs/|desktop/docs/|desktop/README[^/]*\.md$|[^/]+\.md$|LICENSE$|zeabur\.yaml$|\.github/dependabot\.yml$) ]]; then
              : # Documentation and hosting templates: nothing to build or test.
            else
              app=true
            fi
          done <<< "$changed"

          echo "app=$app" >> "$GITHUB_OUTPUT"
          echo "website=$website" >> "$GITHUB_OUTPUT"
          echo "Dashboard and desktop jobs: $app; website job: $website"

  application:
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma clients
        run: |
          pnpm prisma:generate
          pnpm desktop:prisma:generate

      - name: Validate Prisma schemas
        run: |
          pnpm prisma:validate
          pnpm desktop:prisma:validate

      - name: Type-check web and desktop targets
        run: |
          pnpm typecheck
          pnpm desktop:typecheck

      - name: Test desktop runtime contracts
        run: pnpm desktop:test

      - name: Build desktop Next.js runtime
        run: pnpm desktop:build:web

  # Builds the self-hosted image and boots it against PostgreSQL on a network
  # with no internet access (.github/scripts/docker-smoke-test.sh). An image
  # that cannot start, downloads anything at startup, or ships desktop or
  # build-only packages fails here instead of reaching docker-publish.yml.
  docker:
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          provenance: false
          tags: threads-analytics:ci
          cache-from: type=gha,scope=ci-docker
          cache-to: type=gha,scope=ci-docker,mode=max

      - name: Smoke-test image
        run: bash .github/scripts/docker-smoke-test.sh threads-analytics:ci

  native-shell:
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: macos-14
    permissions:
      contents: read
      # Only used to post the test-build download link on the PR.
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate packaging runtime
        run: pnpm desktop:package:check

      - name: Validate Native SDK manifest
        run: node_modules/.bin/native validate desktop/app.json

      # Builds the web runtime and the Native SDK shell, then bundles both.
      - name: Package macOS app
        run: pnpm desktop:package:macos

      # Boots the packaged sidecar from outside the checkout, where the repo's
      # node_modules cannot mask a dependency missing from the bundle.
      - name: Smoke-test packaged app
        run: pnpm desktop:smoke:macos

      - name: Test Native SDK shell
        run: node_modules/.bin/native test desktop --yes

      # ditto keeps the bundle's symlinks and executable bits, which
      # upload-artifact's own zipping would drop; archive: false then uploads
      # that zip as-is instead of wrapping it in a second archive.
      - name: Zip test build
        id: test-build
        working-directory: desktop/zig-out/package
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          label="${HEAD_SHA:0:7}"
          if [[ -n "$PR_NUMBER" ]]; then label="pr${PR_NUMBER}-${label}"; fi
          asset="Threads-Analytics-${label}-macos-arm64.zip"
          ditto -c -k --keepParent "Threads Analytics.app" "$RUNNER_TEMP/$asset"
          echo "path=$RUNNER_TEMP/$asset" >> "$GITHUB_OUTPUT"
          echo "asset=$asset" >> "$GITHUB_OUTPUT"

      - name: Upload test build
        id: upload
        uses: actions/upload-artifact@v7
        with:
          path: ${{ steps.test-build.outputs.path }}
          archive: false
          retention-days: 14
          if-no-files-found: error

      # Fork PRs get a read-only token, so they only get the artifact on the
      # run page. One comment per PR, updated in place on every push.
      - name: Comment test build link on PR
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          ASSET: ${{ steps.test-build.outputs.asset }}
          ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          marker="<!-- desktop-test-build -->"
          body="$(cat <<BODY
          $marker
          ### macOS test build

          [\`$ASSET\`]($ARTIFACT_URL) — built from $HEAD_SHA ([run]($RUN_URL)). Apple silicon only; the download needs a GitHub login and expires after 14 days.

          The build is ad-hoc signed and not notarized, so after unzipping, clear the quarantine flag before the first launch:

          \`\`\`bash
          xattr -dr com.apple.quarantine "Threads Analytics.app"
          \`\`\`
          BODY
          )"
          comment_id="$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" --paginate \
            --jq ".[] | select(.user.login == \"github-actions[bot]\" and (.body | startswith(\"$marker\"))) | .id")"
          comment_id="${comment_id%%$'\n'*}"
          if [[ -n "$comment_id" ]]; then
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$comment_id" -f body="$body" > /dev/null
          else
            gh api --method POST "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" -f body="$body" > /dev/null
          fi

  # The marketing website is an independent pnpm project with its own lockfile
  # (see website/pnpm-workspace.yaml), so it installs and builds on its own.
  website:
    needs: changes
    if: needs.changes.outputs.website == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          package_json_file: website/package.json

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: website/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      # Production builds refuse to run without the canonical origin
      # (website/lib/site.ts), so CI builds against the real one.
      - name: Build
        env:
          SITE_URL: https://threads-analytics.app
          NEXT_TELEMETRY_DISABLED: "1"
        run: pnpm build
