name: Build and Publish Docker Image

# Dispatched by hand, it publishes main between releases as `latest` and
# `sha-<short sha>`. The Release workflow calls it with a version instead: the
# image then carries that version and is pushed only as `sha-<short sha>`, and
# Release tags it X.Y.Z once the Mac app has passed too. `latest`, X.Y and X
# move when Promote Release publishes the version.

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      version:
        description: "Release version baked into the image, a plain X.Y.Z checked by the caller."
        required: true
        type: string
    outputs:
      digest:
        description: "Digest of the pushed multi-platform image."
        value: ${{ jobs.build-and-push.outputs.digest }}

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

# Actions are pinned to commit SHAs because Release calls this workflow with
# packages: write and id-token: write.
jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,format=short
            type=raw,value=latest,enable=${{ inputs.version == '' }}
          labels: ${{ inputs.version != '' && format('org.opencontainers.image.version={0}', inputs.version) || '' }}

      # Boot the amd64 image against PostgreSQL before anything is pushed, so a
      # broken image never becomes `latest`. The multi-platform build below
      # reuses these layers from the builder's cache.
      - name: Build image for smoke test
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          load: true
          provenance: false
          build-args: |
            GIT_COMMIT_SHA=${{ github.sha }}
            IMAGE_REPOSITORY=${{ github.repository }}
            IMAGE_VERSION=${{ inputs.version }}
          tags: threads-analytics:smoke
          cache-from: type=gha

      - name: Smoke-test image
        run: bash .github/scripts/docker-smoke-test.sh threads-analytics:smoke

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            GIT_COMMIT_SHA=${{ github.sha }}
            IMAGE_REPOSITORY=${{ github.repository }}
            IMAGE_VERSION=${{ inputs.version }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Generate artifact attestation
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
