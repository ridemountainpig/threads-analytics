name: Build and Publish Docker Image

# Every run pushes the multi-platform image as `sha-<short sha>` and then
# smoke-tests that pushed digest natively on amd64 and arm64. Dispatched by
# hand, it publishes main between releases: `latest` moves to the digest only
# after both tests pass. The Release workflow calls it with a version instead:
# the image carries that version, `latest` is left alone, and Release tags the
# tested digest X.Y.Z once the Mac app has passed too. `latest`, X.Y and X move
# when Promote Release publishes the version.

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      version:
        description: "Release version baked into the image, a plain X.Y.Z checked by the caller."
        required: true
        type: string
    outputs:
      digest:
        description: "Digest of the pushed multi-platform image, smoke-tested on every platform."
        value: ${{ jobs.build-and-push.outputs.digest }}

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

# Actions are pinned to commit SHAs because Release calls this workflow with
# packages: write and id-token: write.
jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: type=sha,format=short
          labels: ${{ inputs.version != '' && format('org.opencontainers.image.version={0}', inputs.version) || '' }}

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            GIT_COMMIT_SHA=${{ github.sha }}
            IMAGE_REPOSITORY=${{ github.repository }}
            IMAGE_VERSION=${{ inputs.version }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Generate artifact attestation
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  # Boots the digest that was pushed, on a native runner per platform, so
  # neither variant reaches `latest` or a release untested.
  smoke-test:
    name: smoke-test (${{ matrix.arch }})
    needs: build-and-push
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: read
    steps:
      # Only for the smoke-test script; the image under test comes from GHCR.
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Smoke-test the pushed image
        env:
          DIGEST: ${{ needs.build-and-push.outputs.digest }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          image="$REGISTRY/${IMAGE_NAME,,}@$DIGEST"
          docker pull "$image"
          pulled="$(docker image inspect -f '{{.Architecture}}' "$image")"
          if [[ "$pulled" != "$ARCH" ]]; then
            echo "::error::Pulled a $pulled image on the $ARCH runner"
            exit 1
          fi
          bash .github/scripts/docker-smoke-test.sh "$image"

  tag-latest:
    needs: [build-and-push, smoke-test]
    if: inputs.version == ''
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Point latest at the tested image
        env:
          DIGEST: ${{ needs.build-and-push.outputs.digest }}
        run: |
          set -euo pipefail
          image="$REGISTRY/${IMAGE_NAME,,}"
          docker buildx imagetools create --tag "$image:latest" "$image@$DIGEST"
          tagged="sha256:$(docker buildx imagetools inspect --raw "$image:latest" | sha256sum | cut -d ' ' -f 1)"
          if [[ "$tagged" != "$DIGEST" ]]; then
            echo "::error::$image:latest is $tagged, expected $DIGEST"
            exit 1
          fi
          echo "$image:latest → $DIGEST"
